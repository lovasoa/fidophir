version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      compatible-actions:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories:
      - /packaging/images/deb
      - /packaging/images/rpm
    schedule:
      interval: daily
