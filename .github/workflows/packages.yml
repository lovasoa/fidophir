name: Test and publish packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      source-sha:
        description: Exact main-history commit to build (used by dependency automation)
        type: string
        default: ''

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ inputs.source-sha || github.sha }}

# No concurrency cancellation: every main commit gets its own tested release.
jobs:
  images:
    name: Read pinned build images
    runs-on: ubuntu-latest
    outputs:
      fedora: ${{ steps.images.outputs.fedora }}
      rust: ${{ steps.images.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - id: images
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected an exact commit SHA'; exit 1; }
          echo "fedora=$(awk '$1 == "FROM" {print $2}' packaging/images/fedora/Dockerfile)" >> "$GITHUB_OUTPUT"
          echo "rust=$(awk '$1 == "FROM" {print $2}' packaging/images/rust/Dockerfile)" >> "$GITHUB_OUTPUT"
  rpm:
    name: Test and build Fedora 44 RPM
    runs-on: ubuntu-latest
    needs: images
    container: ${{ needs.images.outputs.fedora }}
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install Fedora build and simulator dependencies
        run: >-
          dnf install -y git rust cargo rustfmt clippy gcc make clang-devel
          pkgconf-pkg-config glib2-devel tpm2-tss-devel systemd-rpm-macros
          rpm-build redhat-rpm-config python3 swtpm tpm2-tools
          python3-fido2 python3-gobject dbus-daemon nodejs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          submodules: true
      - name: Choose a unique, increasing package version
        id: version
        shell: bash
        run: |
          base=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          version="${base}+git${GITHUB_RUN_NUMBER}.${SOURCE_SHA:0:12}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Prepare pinned upstream sources and fetch locked dependencies
        run: |
          make prepare
          cargo fetch --locked
          cargo fetch --locked --manifest-path build/opensk/Cargo.toml
      - name: Check formatting and lint
        run: |
          cargo fmt --check
          cargo clippy --frozen --all-targets --features integration-tests -- -D warnings
          node --test tests/dependency-merge.test.cjs
      - name: Run library and independent TPM/desktop integration tests
        run: |
          make test
          cargo test --frozen --manifest-path build/opensk/Cargo.toml --features std --lib
          make integration
      - name: Build offline source bundle and RPM
        shell: bash
        run: |
          python3 tools/source_bundle.py --version "$PACKAGE_VERSION" --output dist
          mkdir -p rpmbuild/SOURCES
          cp "dist/fidophir-${PACKAGE_VERSION}.tar.gz" rpmbuild/SOURCES/
          rpmbuild -ba --define "_topdir $PWD/rpmbuild" --define "fidophir_version $PACKAGE_VERSION" packaging/fidophir.spec
          cp rpmbuild/RPMS/x86_64/*.rpm rpmbuild/SRPMS/*.rpm dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-rpm
          if-no-files-found: error
          path: |
            dist/*.rpm
            dist/*.tar.gz

  deb:
    name: Build Debian 13 DEB
    needs: [images, rpm]
    runs-on: ubuntu-latest
    container: ${{ needs.images.outputs.rust }}
    timeout-minutes: 30
    env:
      PACKAGE_VERSION: ${{ needs.rpm.outputs.version }}
      DEBFULLNAME: Ophir Lojkine
      DEBEMAIL: lovasoa@users.noreply.github.com
    steps:
      - name: Install Debian native build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends debhelper dpkg-dev devscripts libglib2.0-dev libtss2-dev libclang-dev python3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-rpm
          path: incoming
      - name: Build from the same offline source bundle
        shell: bash
        run: |
          tar -xzf "incoming/fidophir-${PACKAGE_VERSION}.tar.gz"
          cd "fidophir-${PACKAGE_VERSION}"
          sha256sum --check SHA256SUMS > /dev/null
          dch --newversion "$PACKAGE_VERSION" --distribution unstable "Build commit $SOURCE_SHA."
          rustc --version
          cargo --version
          # Rust/Cargo are supplied by the pinned official image, not dpkg.
          dpkg-buildpackage --build=binary --no-sign -d
          mkdir -p ../dist
          cp ../fidophir_*.deb ../dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-deb
          if-no-files-found: error
          path: dist/*.deb

  publish:
    name: Publish packages for this main commit
    needs: [rpm, deb]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PACKAGE_VERSION: ${{ needs.rpm.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: packages
      - name: Publish checksummed packages without rebuilding
        shell: bash
        run: |
          (cd packages && sha256sum -- ./*.deb ./*.rpm ./*.tar.gz > SHA256SUMS)
          status=$(gh api "repos/${GH_REPO}/compare/${SOURCE_SHA}...main" --jq .status)
          [[ "$status" == ahead || "$status" == identical ]] || { echo 'Source is outside main history'; exit 1; }
          tag="build-${SOURCE_SHA}"
          printf 'Experimental fidophir build for commit `%s`.\n\nRead the README for supported package targets and physical acceptance before enrollment.\n' "$SOURCE_SHA" > release-notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" packages/* --clobber
          else
            gh release create "$tag" packages/* --target "$SOURCE_SHA" --title "fidophir $PACKAGE_VERSION" --notes-file release-notes.md --latest=false
          fi
          # A slower old build must not replace a newer main commit as Latest.
          if [ "$(gh api "repos/${GH_REPO}/commits/main" --jq .sha)" = "$SOURCE_SHA" ]; then
            gh release edit "$tag" --latest
          fi
