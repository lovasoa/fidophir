name: Test and publish packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.sha }}

# No concurrency cancellation: every main commit gets its own tested release.
jobs:
  images:
    name: Read pinned build images
    runs-on: ubuntu-latest
    outputs:
      rpm: ${{ steps.images.outputs.rpm }}
      deb: ${{ steps.images.outputs.deb }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - id: images
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected an exact commit SHA'; exit 1; }
          echo "rpm=$(awk '$1 == "FROM" {print $2}' packaging/images/rpm/Dockerfile)" >> "$GITHUB_OUTPUT"
          echo "deb=$(awk '$1 == "FROM" {print $2}' packaging/images/deb/Dockerfile)" >> "$GITHUB_OUTPUT"
  rpm:
    name: Test and build RPM
    runs-on: ubuntu-latest
    needs: images
    container: ${{ needs.images.outputs.rpm }}
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install RPM build and simulator dependencies
        run: >-
          dnf install -y git rust cargo rustfmt clippy gcc make clang-devel
          pkgconf-pkg-config glib2-devel tpm2-tss-devel systemd-rpm-macros
          rpm-build redhat-rpm-config python3 swtpm tpm2-tools
          python3-fido2 python3-gobject dbus-daemon
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Choose a unique, increasing package version
        id: version
        shell: bash
        run: |
          # Checkout's temporary safe.directory configuration does not persist
          # into container job steps, which may run as a different user.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          # Commit count increases along main history, even when old builds are rerun.
          commit_count=$(git rev-list --count HEAD)
          version="${base}+git${commit_count}.${SOURCE_SHA:0:12}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Fetch locked Cargo dependencies
        run: cargo fetch --locked
      - name: Check formatting and lint
        run: |
          cargo fmt --check
          cargo clippy --frozen --all-targets --features integration-tests -- -D warnings
      - name: Run library and independent TPM/desktop integration tests
        run: |
          make test
          make integration
      - name: Build RPM from tracked sources
        shell: bash
        run: |
          bash packaging/build.sh rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-rpm
          if-no-files-found: error
          path: |
            dist/*.rpm

      - name: Build a simulator transport variant through the normal RPM recipe
        run: |
          CARGO_FEATURES=systemd-tests RPM_BINARY_ONLY=1 bash packaging/build.sh rpm systemd-packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: systemd-package-rpm
          if-no-files-found: error
          path: systemd-packages/*.rpm

  deb:
    name: Build DEB
    needs: [images, rpm]
    runs-on: ubuntu-latest
    container: ${{ needs.images.outputs.deb }}
    timeout-minutes: 45
    env:
      PACKAGE_VERSION: ${{ needs.rpm.outputs.version }}
      DEBFULLNAME: Ophir Lojkine
      DEBEMAIL: lovasoa@users.noreply.github.com
    steps:
      - name: Install DEB native build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends debhelper dpkg-dev devscripts git libglib2.0-dev libtss2-dev libclang-dev python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Build DEB from the same commit
        shell: bash
        run: |
          DEB_IGNORE_BUILD_DEPS=1 bash packaging/build.sh deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-deb
          if-no-files-found: error
          path: dist/*.deb

      - name: Build a simulator transport variant through the normal DEB recipe
        run: |
          CARGO_FEATURES=systemd-tests DEB_IGNORE_BUILD_DEPS=1 bash packaging/build.sh deb systemd-packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: systemd-package-deb
          if-no-files-found: error
          path: systemd-packages/*.deb

  systemd:
    name: Real systemd lifecycle (${{ matrix.format }})
    needs: [rpm, deb]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        format: [deb, rpm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: systemd-package-${{ matrix.format }}
          path: systemd-packages
      - name: Boot a disposable systemd container and install the package
        run: bash tests/systemd_container.sh "${{ matrix.format }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: systemd-journal-${{ matrix.format }}
          path: systemd-*.log
          if-no-files-found: warn

  hid:
    name: Test FIDO CLI through Linux UHID
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Install build and simulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev libglib2.0-dev libtss2-dev libtss2-tcti-swtpm0t64 pkg-config swtpm fido2-tools
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Build test authenticator
        run: cargo build --locked --bin fidophir-integration --features integration-tests
      - name: Permit the runner to use the test device
        run: |
          sudo modprobe uhid
          test -c /dev/uhid
          sudo chmod 0666 /dev/uhid
          printf '%s\n' \
            'SUBSYSTEM=="hidraw", KERNELS=="0006:0000:0001.*", IMPORT{parent}="HID_*"' \
            'SUBSYSTEM=="hidraw", KERNELS=="0006:0000:0001.*", ENV{HID_UNIQ}=="4294967295", MODE="0666", SYMLINK+="fidophir-$env{HID_UNIQ}"' \
            | sudo tee /etc/udev/rules.d/99-fidophir-test.rules > /dev/null
          sudo udevadm control --reload
      - name: Exercise actual virtual device and FIDO tools
        run: bash tests/hid_cli.sh "$PWD/target/debug/fidophir-integration"

  publish:
    name: Publish packages for this main commit
    needs: [rpm, deb, hid, systemd]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PACKAGE_VERSION: ${{ needs.rpm.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: packages
      - name: Publish checksummed packages without rebuilding
        shell: bash
        run: |
          shopt -s nullglob
          rpm=(packages/*x86_64.rpm)
          deb=(packages/*.deb)
          source_rpm=(packages/*.src.rpm)
          [[ ${#rpm[@]} == 1 && ${#deb[@]} == 1 && ${#source_rpm[@]} == 1 ]] || { echo 'Expected exactly one of each package'; exit 1; }
          mv -- "${rpm[0]}" packages/fidophir.rpm
          mv -- "${deb[0]}" packages/fidophir.deb
          (cd packages && sha256sum -- ./*.deb ./*.rpm > SHA256SUMS)
          status=$(gh api "repos/${GH_REPO}/compare/${SOURCE_SHA}...main" --jq .status)
          [[ "$status" == ahead || "$status" == identical ]] || { echo 'Source is outside main history'; exit 1; }
          tag="build-${SOURCE_SHA}"
          printf 'Experimental fidophir build for commit `%s`.\n\nRead the README for installation requirements and physical acceptance before enrollment.\n' "$SOURCE_SHA" > release-notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --title "fidophir $PACKAGE_VERSION" --notes-file release-notes.md
          else
            gh release create "$tag" --target "$SOURCE_SHA" --title "fidophir $PACKAGE_VERSION" --notes-file release-notes.md --latest=false
          fi
          gh release upload "$tag" \
            "packages/fidophir.rpm#Fidophir $PACKAGE_VERSION (RPM)" \
            "packages/fidophir.deb#Fidophir $PACKAGE_VERSION (DEB)" \
            "${source_rpm[0]}" packages/SHA256SUMS --clobber
          # A slower old build must not replace a newer main commit as Latest.
          if [ "$(gh api "repos/${GH_REPO}/commits/main" --jq .sha)" = "$SOURCE_SHA" ]; then
            gh release edit "$tag" --latest
          fi
