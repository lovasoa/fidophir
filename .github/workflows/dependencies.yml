name: Update Cargo dependencies
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      track:
        type: choice
        options: [both, compatible, major]
        default: both
permissions:
  contents: read
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        track: ${{ fromJSON(inputs.track == 'compatible' && '["compatible"]' || inputs.track == 'major' && '["major"]' || '["compatible","major"]') }}
    concurrency:
      group: cargo-update-${{ matrix.track }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      UPDATE_TRACK: ${{ matrix.track }}
    steps:
      - name: Install the standard Cargo updater
        run: |
          dnf install -y git rust cargo gcc openssl-devel pkgconf-pkg-config make
          cargo install cargo-edit --locked --no-default-features --features upgrade
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update manifest and lockfile
        shell: bash
        run: |
          if [[ "$UPDATE_TRACK" == major ]]; then
            cargo upgrade --compatible ignore --incompatible allow --pinned allow
            if git diff --quiet -- Cargo.toml; then
              exit 0
            fi
          else
            cargo upgrade
          fi
          cargo update
      - name: Open or update the dependency PR
        id: pr
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725 # v8.0.0
        with:
          branch: automation/cargo-${{ matrix.track }}
          base: main
          add-paths: |
            Cargo.toml
            Cargo.lock
          commit-message: 'chore(deps): update Cargo ${{ matrix.track }} dependencies'
          title: 'chore(deps): update Cargo ${{ matrix.track }} dependencies'
          body: |
            Update Cargo dependencies and Cargo.lock.
            OpenSK version changes require the adapter contract review in src/opensk_adapter.rs.
            The package workflow is dispatched explicitly because PRs created with GITHUB_TOKEN do not trigger pull_request workflows.
          delete-branch: true
      - name: Test the dependency PR
        if: steps.pr.outputs.pull-request-number && steps.pr.outputs.pull-request-operation != 'closed'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {owner, repo} = context.repo;
            await github.rest.actions.createWorkflowDispatch({owner, repo, workflow_id: 'packages.yml',
              ref: `automation/cargo-${process.env.UPDATE_TRACK}`});
