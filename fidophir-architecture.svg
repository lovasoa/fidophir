<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-label="Fidophir architecture showing the website, Firefox, Linux virtual HID security key, Fidophir service, TPM chip, and polkit approval">
<desc>Website server exchanges WebAuthn over HTTPS with Firefox. Firefox exchanges FIDO2 CTAP messages over a Linux UHID virtual security-key device with Fidophir. Fidophir uses the TPM for PIN authorization and cryptographic signing, and login1, polkit, and GNOME for desktop approval. This is a conceptual communication diagram, not a physical wiring schematic.</desc>
