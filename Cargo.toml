[package]
name = "fidophir"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.92"

[features]
integration-tests = ["opensk/std"]

[dependencies]
opensk = { path = "build/opensk", default-features = false, features = ["software_crypto", "resident_only"] }
sk-cbor = { path = "build/cbor" }
glib = { version = "0.22.10", features = ["v2_66"] }
gio = "0.22.10"
nix = { version = "0.31.3", features = ["fs", "time", "process", "user"] }
rand = { version = "0.10.3", default-features = false, features = ["std", "std_rng", "sys_rng"] }
tss-esapi = "7.6.0"
uhid-virt = "0.0.8"
p256 = { version = "0.14", default-features = false, features = ["alloc", "ecdsa"] }
sha2 = "0.11"
subtle = "2"

[[bin]]
name = "fidophir"
path = "src/main.rs"

[[bin]]
name = "fidophir-integration"
path = "src/bin/integration.rs"
required-features = ["integration-tests"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
