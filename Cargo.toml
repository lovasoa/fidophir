[package]
name = "fidophir"
version = "0.1.1"
edition = "2024"
description = "A TPM-backed virtual FIDO2 security key for Linux"
homepage = "https://github.com/lovasoa/fidophir"
repository = "https://github.com/lovasoa/fidophir"
license = "Apache-2.0"
rust-version = "1.92"

[features]
integration-tests = ["opensk/std"]
# Disposable systemd CI packages only; never enable for release packages.
systemd-tests = []

[dependencies]
log = "0.4.35"
# Review the adapter contract in src/opensk_adapter.rs before updating OpenSK.
opensk = { version = "=0.1.0", default-features = false, features = ["software_crypto"] }
sk-cbor = "=0.2.0"
glib = { version = "0.22.10", features = ["v2_66"] }
gio = "0.22.10"
nix = { version = "0.31.3", features = ["time", "process", "user"] }
rand = { version = "0.10.3", default-features = false, features = ["std", "std_rng", "sys_rng"] }
tss-esapi = "7.6.0"
uhid-virt = "0.0.8"
p256 = { version = "0.14", default-features = false, features = ["alloc", "ecdsa"] }

[dev-dependencies]
nix = { version = "0.31.3", features = ["fs"] }

[[bin]]
name = "fidophir"
path = "src/main.rs"

[[bin]]
name = "fidophir-integration"
path = "src/bin/integration.rs"
required-features = ["integration-tests"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
